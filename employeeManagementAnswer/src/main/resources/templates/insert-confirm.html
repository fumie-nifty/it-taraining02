<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">

<head>
	<meta charset="utf-8">
	<link rel="stylesheet" type="text/css" th:href="@{/style.css}" />
	<title>従業員登録確認画面</title>
</head>

<body>
	<div id="mainArea">
		<h1>従業員登録</h1>
		<h2>従業員登録確認画面</h2>
		<p>よろしければ、[確定]ボタンを押してください</p>
		<table border="1">
			<tr>
				<th>従業員ID</th>
				<td th:text="${employeeDto.employeeId}">employeeId</td>
			</tr>
			<tr>
				<th>従業員名</th>
				<td th:text="${employeeDto.employeeName}">employeeName</td>
			</tr>
			<tr>
				<th>部署名</th>
				<td th:text="${employeeDto.section}">section</td>
			</tr>
			<tr>
				<th>内線番号</th>
				<td th:text="${employeeDto.phone}">phone</td>
			</tr>
		</table>
		<p>
			<form method="post" th:action="@{/commitInsert}">
				<button type="submit">確定</button>
			</form>
		</p>
		<p>
			<form method="post" th:action="@{/reviseInput}">
				<button type="submit">修正</button>
			</form>
		</p>
	</div>
	<div id="footerArea">
		<a th:href="@{/}">[トップに戻る]</a>
	</div>
</body>

</html>
