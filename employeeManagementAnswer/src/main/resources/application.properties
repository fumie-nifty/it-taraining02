# ==============================================================
# Application basic settings
# ==============================================================
spring.application.name=employeeManagementAnswer
server.port=8082

# ==============================================================
# Session / Web Server settings
# ==============================================================
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=30m

# ==============================================================
# View (Thymeleaf)
# ==============================================================
spring.thymeleaf.cache=false

# ==============================================================
# Database / SQL settings
# ==============================================================
spring.sql.init.encoding=UTF-8
spring.datasource.url=jdbc:mysql://localhost:3306/springhandson
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=springmysql
spring.datasource.password=springmysql

# ==============================================================
# Spring framework settings
# Spring Boot 3.4.x + Gradle 環境では
# JDBC AutoConfiguration の競合が発生する場合があるため指定
# ==============================================================
spring.main.allow-bean-definition-overriding=true

# ==============================================================
# Error handling
# セッションタイムアウト時は Controller を経由しないため、
# Spring 標準エラー処理でメッセージを表示する目的で指定
# ==============================================================
server.error.include-message=always
